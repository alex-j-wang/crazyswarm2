trajectories:
  cf2:
    type: "spiral"
    center: [0.0, 0.0]
    radius_start: 1.0
    radius_end: 1.0
    height_start: 0.5
    height_end: 0.5
    revolutions: 3
  cf74:
    type: "spiral"
    center: [0.0, 0.0]
    radius_start: 1.0
    radius_end: 1.0
    height_start: 1.0
    height_end: 1.0
    revolutions: 3

variables:
  cf2:
    hover: 41000
  cf90:
    hover: 39000
  cf68:
    hover: 40500
  cf74:
    hover: 40000

constants:
  controller_type: "geometric" # Options: geometric, mpc, hybrid, gp, knode
  control_frequency: 50.0 # Hz
  z_final: 0.02 # Height above ground at which power should be cut, m
  z_max: 2.0 # Maximum height above ground, m
  
  # Quadrotor physical parameters
  mass: 0.03 # kg
  Ixx: 1.43e-5 # kg*m^2
  Iyy: 1.43e-5 # kg*m^2
  Izz: 2.89e-5 # kg*m^2
  arm_length: 0.046 # meters
  
  # Geometric controller gains
  pos_kp: 2.0
  posz_kp: 4.0
  geo_rollpitch_kp: 10.0
  geo_yaw_kp: 50.0
  
  # Waypoint parameters
  setup_speed: 0.2 # m/s
  desired_speed: 0.2 # m/s

  # Enable plotting of intended vs. actual trajectories
  plotting: true

  # Online learning parameters
  data_frequency: 50.0 # data point frequency, Hz
  model_period: 10.0 # seconds between model updates
  noise: 0.000 # noise level for training data

  # Enable downwash control term
  downwash: true
