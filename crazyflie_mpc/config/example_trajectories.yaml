# Example trajectories
circle:
  type: "circle"
  radius: 0.5
  center: [0.25, 4.5, 0.5]

waypoint:
  type: "waypoint"
  p0: [-1.409, 2.826, 0.55]
  p1: [1.609, 2.826, 0.55]
  p2: [1.609, 5.826, 0.55]
  p3: [-1.409, 5.826, 0.55]
  p4: [-1.409, 2.826, 0.55]
  p5: [-1.409, 2.826, 0.3]
  p6: [-1.409, 2.826, 0.0]

linear:
  type: "linear"
  start: [0.0, 0.0, 0.5]
  end: [-1.0, 0.0, 0.5]

figure8:
  type: "figure8"
  center: [0.0, 0.0, 0.5]
  scale: [0.8, 0.4]

spiral:
  type: "spiral"
  center: [0.0, 0.0]
  radius_start: 0.2
  radius_end: 0.8
  height_start: 0.5
  height_end: 1.5
  revolutions: 3

hover:
  type: "hover"
  position: [0.0, 0.0, 0.5]
